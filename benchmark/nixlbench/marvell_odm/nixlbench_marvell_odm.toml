# Complete nixlbench configuration for MARVELL_ODM backend
#
# Usage from nixlbench build directory:
#   export ODM_ADDR=0x800000000
#   export LD_LIBRARY_PATH=.../build/src/core:.../build/src/plugins/marvell_odm
#   export NIXL_PLUGIN_DIR=.../build/src/plugins/marvell_odm
#   ./nixlbench --config_file ../marvell_odm/nixlbench_marvell_odm.toml

backend = "MARVELL_ODM"
device_list = "odm0"
initiator_seg_type = "VRAM"
target_seg_type = "DRAM"
op_type = "WRITE"
check_consistency = false
total_buffer_size = 8589934592
start_block_size = 4096
max_block_size = 33554432
start_batch_size = 64
max_batch_size = 64
num_iter = 112
warmup_iter = 16
large_blk_iter_ftr = 16
recreate_xfer = true
